site_name: Cybersecurity Labs - Nicholas Arcari
site_description: >-
  Documentazione completa di laboratori di penetration testing: dalla ricognizione
  al cloud security. Red Team, Blue Team, exploit development e secure coding.
site_url: https://nicholas-arcari.github.io/cybersecurity-labs/
repo_url: https://github.com/Nicholas-Arcari/cybersecurity-labs
repo_name: Nicholas-Arcari/cybersecurity-labs

# The repo root is the documentation. MkDocs >= 1.6 refuses to build with this
# file inside docs_dir, so .github/workflows/deploy-docs.yml builds from a copy
# staged outside the checkout, rewriting docs_dir/site_dir. A plain
# `mkdocs build` from the repo root fails by design: replicate that step locally.
docs_dir: .
site_dir: site

theme:
  name: material
  language: it
  palette:
    - scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-4
        name: Passa alla modalita chiara
    - scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-7
        name: Passa alla modalita scura
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      lang:
        - it
        - en
  - awesome-pages
  - social:
      cards_layout_options:
        background_color: "#1a1a2e"
        color: "#e0e0e0"
  - exclude:
      glob:
        - "*.en.md"
        - ".github/**"
        - "site/**"
        - "node_modules/**"
        - "tests/**"
        - "scripts/**"
        - ".gitignore"
        - ".pre-commit-config.yaml"
        - "requirements-docs.txt"
        - ".markdownlint.json"
        - "LICENSE"

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - def_list
  - pymdownx.tasklist:
      custom_checkbox: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Nicholas-Arcari
  generator: false
